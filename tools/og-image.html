<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background-color:#F5F0E7;
  background-image:
    linear-gradient(rgba(255,255,255,.8) 3px,transparent 3px),
    linear-gradient(90deg,rgba(255,255,255,.8) 3px,transparent 3px);
  background-size:104px 104px;
  font-family:"Nunito",sans-serif;color:#6E4A2C;
  display:flex;align-items:center;gap:52px;padding:0 64px;
}
.left{flex:1;min-width:0}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:98px;line-height:1.0;letter-spacing:-1px}
.tag{font-family:"Baloo 2",sans-serif;font-weight:600;font-size:36px;color:#A8917C;margin-top:6px}
.sub{font-size:28px;font-weight:600;margin-top:26px;line-height:1.45}
.pills{display:flex;gap:11px;margin-top:32px}
.pill{background:#fff;border:3px solid #EDE4D6;border-radius:999px;padding:10px 20px;font-weight:700;font-size:21px;white-space:nowrap}
.pill.o{background:#E8942F;border-color:#E8942F;color:#fff}
.board{
  flex:0 0 auto;background:#fff;border-radius:32px;padding:22px;
  box-shadow:0 18px 0 rgba(110,74,44,.08);
  display:grid;grid-template-columns:repeat(5,76px);grid-template-rows:repeat(5,76px);gap:6px;
}
.c{border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1}
</style></head><body>
<div class="left">
  <h1>Meowdoku</h1>
  <div class="tag">Puzzle solver</div>
  <div class="sub">Drop in a screenshot.<br>Get the answer instantly.</div>
  <div class="pills"><span class="pill o">Show a cat</span><span class="pill">Rule out squares</span><span class="pill">Solve it all</span></div>
</div>
<div class="board" id="b"></div>
<script>
const A="#F7C9A0",B="#A8D8C8",C="#C7CBEE",D="#F3D98B",E="#E9B8C9";
const map=[[A,A,A,B,B],[A,A,B,B,B],[A,D,B,C,C],[D,D,D,C,C],[D,E,E,E,C]];
const cats={"0,0":1,"1,2":1,"2,4":1,"3,1":1,"4,3":1};
let h="";
for(let r=0;r<5;r++)for(let c=0;c<5;c++)
  h+=`<div class="c" style="background:${map[r][c]}">${cats[r+","+c]?"🐱":""}</div>`;
document.getElementById("b").innerHTML=h;
</script></body></html>
